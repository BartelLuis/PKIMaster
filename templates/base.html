<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f172a;
        --surface: #ffffff;
        --muted: #475569;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --border: #dbe1ea;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: linear-gradient(180deg, #e2e8f0 0%, #f8fafc 100%);
        color: #0f172a;
      }
      header {
        background: var(--bg);
        color: white;
        padding: 2rem 1.5rem;
      }
      header h1, header p { margin: 0; }
      header p { margin-top: .75rem; max-width: 60rem; color: #cbd5e1; }
      main {
        max-width: 1100px;
        margin: -1.5rem auto 2rem;
        padding: 0 1rem;
      }
      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1.25rem;
        box-shadow: 0 14px 30px rgba(15, 23, 42, .06);
      }
      h2, h3 { margin-top: 0; }
      label {
        display: block;
        font-size: .95rem;
        color: var(--muted);
        margin-bottom: .75rem;
      }
      input, select, textarea, button {
        width: 100%;
        margin-top: .35rem;
        border-radius: 12px;
        border: 1px solid #cbd5e1;
        padding: .8rem .9rem;
        font: inherit;
      }
      button {
        background: var(--accent);
        color: white;
        border: none;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: .7rem 0;
        border-bottom: 1px solid #e2e8f0;
        text-align: left;
        vertical-align: top;
      }
      .pill {
        display: inline-block;
        padding: .2rem .55rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: .8rem;
        font-weight: 700;
        text-transform: uppercase;
      }
      .flash {
        list-style: none;
        padding: 0;
        margin: 0 0 1rem;
      }
      .flash li {
        padding: .85rem 1rem;
        border-radius: 14px;
        margin-bottom: .65rem;
        border: 1px solid #bfdbfe;
        background: #eff6ff;
        color: #1d4ed8;
      }
      .actions a {
        margin-right: .75rem;
        color: var(--accent);
        text-decoration: none;
      }
      .muted { color: var(--muted); }
      .mono {
        font-family: ui-monospace, SFMono-Regular, SFMono-Regular, Consolas, monospace;
        word-break: break-all;
      }
      @media (max-width: 720px) {
        main { margin-top: -1rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PKIMaster</h1>
      <p>Manage Root, Intermediate, and Issuing CAs from one Debian-friendly Python web application.</p>
    </header>
    <main>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul class="flash">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
