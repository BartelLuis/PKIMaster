[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkimaster"
version = "0.2.0"
description = "One CA per server: web-managed private PKI with MFA, independent CA approval and Debian APT packaging."
readme = "README.md"
requires-python = ">=3.11"
maintainers = [{name = "PKIMaster maintainers", email = "maintainers@pkimaster.de"}]
dependencies = [
  "Flask>=3.1,<4",
  "cryptography>=43,<51",
  "Werkzeug>=3.1,<4",
  "gunicorn>=23,<27; platform_system != 'Windows'",
]

[project.scripts]
pkimaster-dev = "app:main"

[tool.setuptools]
py-modules = ["app", "enterprise", "mfa", "pki", "pkimaster_server", "wsgi"]

[tool.setuptools.data-files]
"share/pkimaster/templates" = ["templates/*.html"]
