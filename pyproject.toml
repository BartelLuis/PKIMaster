[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkimaster"
version = "0.1.0"
description = "Full-stack PKI management software for Root, Intermediate, and Issuing CAs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.3",
  "cryptography==50.0.1",
]

[project.scripts]
pkimaster-dev = "app:main"
