[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkimaster"
version = "0.2.1"
description = "One CA per server: web-managed private PKI with MFA, independent CA approval and Debian APT packaging."
readme = "README.md"
requires-python = ">=3.11"
maintainers = [{name = "PKIMaster maintainers", email = "maintainers@pkimaster.de"}]
dependencies = [
  "Flask>=3.1,<4",
  "cryptography>=43,<51",
  "Werkzeug>=3.1,<4",
  "PyJWT[crypto]>=2.10.1,<3",
  "ldap3>=2.9.1,<3",
  "requests>=2.32,<3",
  "asn1crypto>=1.5.1,<2",
  "Paramiko>=5.0.0,<6",
  "segno>=1.6.6,<2",
  "gunicorn>=23,<27; platform_system != 'Windows'",
]

[project.optional-dependencies]
pkcs11 = ["PyKCS11>=1.5.17,<2"]

[project.scripts]
pkimaster-dev = "app:main"

[tool.setuptools]
py-modules = ["app", "enterprise", "identity", "mfa", "pki", "key_backends", "key_storage", "audit_integrity", "security", "publication", "publication_transports", "publication_worker", "pkimaster_server", "wsgi"]

[tool.setuptools.data-files]
"share/pkimaster/templates" = ["templates/*.html"]
"share/pkimaster/static/css" = ["static/css/*.css"]
"share/pkimaster/static/js" = ["static/js/*.js"]
