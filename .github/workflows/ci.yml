name: Python CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install application and CI dependencies
        run: python -m pip install . -r requirements-ci.txt
      - name: Run the complete test suite with coverage
        run: python -m coverage run --source=app,enterprise,pki,pkimaster_server -m unittest discover -s tests -v
      - name: Create coverage report
        if: ${{ !cancelled() }}
        run: python -m coverage xml -o coverage.xml
      - name: Retain coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Python, workflow and shell checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation tools
        run: |
          python -m pip install -r requirements-ci.txt
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
      - name: Check Python correctness
        run: python -m ruff check .
      - name: Validate GitHub configuration schemas
        run: |
          check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
          check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
      - name: Check shell scripts
        run: shellcheck scripts/*.sh debian/postinst debian/postrm
      - name: Install verified actionlint binary
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflow expressions and action inputs
        run: '"$RUNNER_TEMP/actionlint" -color'

  distributions:
    name: Python distribution build and installation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install build tools
        run: python -m pip install -r requirements-ci.txt
      - name: Build wheel and source archive
        run: python -m build
      - name: Check distribution metadata and README
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Verify packaged files and isolated wheel installation
        run: python scripts/check-python-artifacts.py
      - name: Retain Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkimaster-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
